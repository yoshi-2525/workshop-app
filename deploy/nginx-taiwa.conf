# /etc/nginx/sites-available/taiwa
# フロントエンドのビルド結果を配信し、/api/ だけバックエンドに転送する。
# server_name を実際のドメインに書き換えてから certbot --nginx を実行すると、HTTPS の設定が追記される
server {
    listen 80;
    server_name your-domain.example;

    root /srv/taiwa/frontend/dist;

    # MAX_UPLOAD_SIZE_BYTES(既定 5MB)より少し大きくする。超えた分はバックエンドが 413 を返す
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite が出力するファイル名にはハッシュが付くので、長くキャッシュしてよい
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router の画面を直接開いたときも index.html を返す
    location / {
        try_files $uri /index.html;
    }
}
